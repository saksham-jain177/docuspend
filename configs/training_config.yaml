# Training Configuration for PaddleOCR-VL Fine-Tuning
# Optimized for Google Colab Free (T4 GPU, 16GB VRAM)
# DocuSpend Project

training:
  epochs: 10
  batch_size: 4  # Small batch for 16GB VRAM with FP16 mixed precision
  gradient_accumulation_steps: 4  # Effective batch size: 4 * 4 = 16
  num_workers: 2
  prefetch_factor: 2
  persistent_workers: true

learning_rate:
  initial: 1e-4
  warmup_steps: 100
  warmup_type: "linear"
  scheduler: "linear"
  decay_steps: 5000
  min_lr: 1e-6

optimization:
  optimizer: "AdamW"
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  epsilon: 1e-8
  max_grad_norm: 1.0

precision:
  mix_precision: true  # FP16 training for efficiency
  precision_type: "amp"  # Automatic Mixed Precision
  scaler_init_scale: 65536

hardware:
  device: "cuda"
  gpu_id: 0
  max_vram_gb: 16
  available_vram_gb: 14  # Reserved 2GB for system

checkpoint:
  save_every_steps: 50
  keep_best_checkpoints: 3
  checkpoint_dir: "models/checkpoints/"
  save_strategy: "steps"
  eval_strategy: "steps"
  eval_steps: 50

logging:
  log_every_steps: 10
  log_dir: "outputs/logs/"
  tensorboard_dir: "outputs/logs/tensorboard/"
  use_tensorboard: true
  use_wandb: false

validation:
  val_split: 0.1  # 10% validation from training data
  val_metric: "accuracy"
  eval_batch_size: 8

early_stopping:
  enabled: true
  patience: 3
  metric: "val_loss"
  mode: "min"

dataset:
  train_data_path: "data/processed/train/"
  val_data_path: "data/processed/val/"
  test_data_path: "data/processed/test/"
  annotation_path: "data/annotations/"
  max_samples: null  # Use all samples (450)

model_save:
  save_best_model: true
  best_model_path: "models/final/best_model.pdparams"
  final_model_path: "models/final/final_model.pdparams"
  export_format: "paddle"

# Augmentation settings
augmentation:
  enabled: true
  random_rotate: [-10, 10]
  random_scale: [0.8, 1.2]
  random_shear: [-10, 10]
  random_brightness: 0.2
  random_contrast: 0.2
  random_hue: 0.1

# Loss function
loss:
  type: "cross_entropy"
  reduction: "mean"

# Metrics to track
metrics:
  - "accuracy"
  - "precision"
  - "recall"
  - "f1"
  - "cer"  # Character Error Rate
  - "wer"  # Word Error Rate

# Resume training
resume:
  enabled: false
  checkpoint_path: null

# Seed for reproducibility
seed: 42
